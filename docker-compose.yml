services:
  worker:
    build: ./worker
    env_file: .env
    expose:
      - "4001"
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: deps
    command: npm run dev
    env_file: .env
    environment:
      - WORKER_URL=http://worker:4001
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - worker
    restart: unless-stopped
